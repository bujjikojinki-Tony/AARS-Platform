[project]
name = "weather-telegram-console"
version = "0.1.0"
description = "Telegram console for weather market signals."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot>=21.0",
  "pydantic>=2.7.0",
  "httpx>=0.27.0",
  "typer>=0.12.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
]

[project.scripts]
weather-telegram-console = "weather_telegram_console.app:main"
weather-telegram-ops-bridge = "weather_telegram_console.ops_bridge_cli:main"
weather-telegram-runtime-snapshot = "weather_telegram_console.runtime_snapshot_cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
